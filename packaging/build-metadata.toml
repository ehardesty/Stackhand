# Build inputs for the current terminal prototype.
# Keep this file in sync with Cargo.lock and the upstream package metadata.

schema_version = 1
rust_version = "1.93.0"
zig_version = "0.15.2"

ghostty_repository = "https://github.com/ghostty-org/ghostty.git"
ghostty_revision = "a887df42c56f6de86c0fe6da9c4eeca37931e083"

libghostty_vt_sys_version = "0.2.1"
libghostty_vt_wrapper_revision = "46a9d2ac941ed600cf43c5e6299c8dfd1d3a1ef0"
libghostty_vt_version = "0.2.1"

# These are the native options passed by libghostty-vt-sys/build.rs.
native_build_options = ["-Demit-lib-vt=true", "-Demit-xcframework=false", "-Dapp-runtime=none"]
native_link_mode = "vendored-static-library"
release_profile = "strip=true,lto=thin"
