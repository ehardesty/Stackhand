[package]
name = "stackhand"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A prototype local development process supervisor"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
crossbeam-channel = "0.5.15"
libghostty-vt = { version = "0.2.1", default-features = false }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
