version: 1

processes:
  # A failed One-shot keeps completed_successfully Dependencies blocked.
  - name: failing-check
    kind: one-shot
    terminal: pipe
    command:
      program: /bin/sh
      args: ["-c", 'printf "check failed with exit status 7\n"; exit 7']

  - name: blocked-dependent
    kind: service
    terminal: pipe
    depends_on:
      - name: failing-check
        condition: completed_successfully
    command:
      program: /bin/sh
      args:
        - -c
        - |
          while :; do
            printf "this line must not appear\n"
            sleep 1
          done

  # A Service that exits without a Stop request is a failed Run, even with
  # exit status zero.
  - name: unexpected-exit
    kind: service
    terminal: pipe
    command:
      program: /bin/sh
      args: ["-c", 'printf "service will exit unexpectedly\n"; sleep 2; exit 0']

  # Start this Process manually to see a clear spawn failure.
  - name: missing-program
    kind: service
    autostart: false
    terminal: pipe
    command:
      program: stackhand-example-command-that-does-not-exist
