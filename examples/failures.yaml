version: 1

processes:
  # A failed One-shot keeps completed_successfully Dependencies blocked.
  failing-check:
    kind: one-shot
    shell: 'printf "check failed with exit status 7\n"; exit 7'

  blocked-dependent:
    depends_on:
      failing-check: completed_successfully
    shell: |
      while :; do
        printf "this line must not appear\n"
        sleep 1
      done

  # A Service that exits without a Stop request is a failed Run, even with
  # exit status zero.
  unexpected-exit:
    shell: 'printf "service will exit unexpectedly\n"; sleep 2; exit 0'

  # Start this Process manually to see a clear spawn failure.
  missing-program:
    autostart: false
    command: [stackhand-example-command-that-does-not-exist]
