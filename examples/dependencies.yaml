version: 1

processes:
  # A successful One-shot can release completed_successfully Dependencies.
  prepare:
    kind: one-shot
    terminal:
      mode: pipe
      input: disabled
    shell: 'printf "prepare started\n"; sleep 2; printf "prepare complete\n"'

  # The Service starts before it becomes ready. This creates a visible window
  # between the started and ready Dependency conditions.
  database:
    kind: service
    terminal:
      mode: pipe
      input: disabled
    ready:
      tcp:
        host: 127.0.0.1
        port: 43122
      interval: 500ms
      timeout: 500ms
    shell: |
      printf "database starting\n"
      sleep 4
      printf "database listening\n"
      exec nc -lk 127.0.0.1 43122

  # A keyed Dependency names the Process and states its condition.
  started-dependent:
    kind: service
    terminal:
      mode: pipe
      input: disabled
    depends_on:
      database: started
    shell: |
      while :; do
        printf "database has started\n"
        sleep 2
      done

  # This One-shot waits for setup completion and Service readiness.
  migrate:
    kind: one-shot
    terminal:
      mode: pipe
      input: disabled
    depends_on:
      prepare: completed_successfully
      database: ready
    shell: 'printf "migration started\n"; sleep 2; printf "migration complete\n"'

  # The final Service starts only after the migration succeeds.
  application:
    kind: service
    terminal:
      mode: pipe
      input: disabled
    depends_on:
      database: ready
      migrate: completed_successfully
    shell: |
      while :; do
        printf "application is running\n"
        sleep 2
      done
