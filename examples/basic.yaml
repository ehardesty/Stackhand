version: 1

processes:
  # A pipe Service starts automatically. Pipe output is read-only.
  clock:
    kind: service
    terminal:
      mode: pipe
      input: disabled
    shell: |
      while :; do
        printf "clock %s\n" "$(date +%H:%M:%S)"
        sleep 1
      done

  # Start this Process with `s`. Press `Esc` to send input to the shell.
  shell:
    kind: service
    autostart: false
    terminal:
      mode: pty
      input: focused
    command: [/bin/sh, "-l"]

  # Start this Process with `s`. Use `r` after it is Done to run it again.
  manual-task:
    kind: one-shot
    autostart: false
    terminal:
      mode: pipe
      input: disabled
    environment:
      EXAMPLE_MESSAGE: hello from a One-shot
    shell: |
      printf "%s\n" "$EXAMPLE_MESSAGE"
      sleep 1
      printf "task complete\n"

  # A disabled Process stays visible but cannot start.
  disabled-example:
    kind: service
    enabled: false
    autostart: false
    terminal:
      mode: pipe
      input: disabled
    command: [/bin/sleep, "300"]
